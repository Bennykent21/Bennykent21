<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="GitHub contribution stats">
<style>
  .bg{fill:#ffffff;stroke:#d0d7de} .num{fill:#0969da;font:700 30px 'Segoe UI',Ubuntu,sans-serif;text-anchor:middle}
  .lbl{fill:#57606a;font:400 13px 'Segoe UI',Ubuntu,sans-serif;text-anchor:middle} .sep{stroke:#d0d7de}
  .foot{fill:#8c959f;font:400 11px 'Segoe UI',Ubuntu,sans-serif;text-anchor:middle}
  @media (prefers-color-scheme: dark) {
    .bg{fill:#0d1117;stroke:#30363d} .num{fill:#58a6ff} .lbl{fill:#8b949e} .sep{stroke:#30363d} .foot{fill:#6e7681}
  }
</style>
<rect x="0.5" y="0.5" width="799" height="149" rx="10" class="bg"/>
<text x="100.0" y="72" class="num">1,405</text>
<text x="100.0" y="102" class="lbl">Contributions since 2022</text>
<text x="300.0" y="72" class="num">1,404</text>
<text x="300.0" y="102" class="lbl">Contributions in 2026</text>
<line x1="200" y1="40" x2="200" y2="112" class="sep"/>
<text x="500.0" y="72" class="num">0</text>
<text x="500.0" y="102" class="lbl">Current streak (days)</text>
<line x1="400" y1="40" x2="400" y2="112" class="sep"/>
<text x="700.0" y="72" class="num">15</text>
<text x="700.0" y="102" class="lbl">Longest streak (days)</text>
<line x1="600" y1="40" x2="600" y2="112" class="sep"/>
<text x="400.0" y="136" class="foot">Best day: 233 contributions · Updated 21 Nov 2026</text>
</svg>